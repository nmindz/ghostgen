[package]
name = "ghostgen"
version = "0.1.0"
description = "Native GUI for Ghostty terminal configuration"
authors = ["evandro.camargo"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ghostgen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.9", features = [] }
tauri-plugin-log = "~2.2"
tauri-plugin-dialog = "~2.2"
tauri-plugin-shell = "~2.2"
dirs = "5"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
